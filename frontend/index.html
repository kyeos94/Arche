<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arche 여신관리</title>
    <script>
      // 첫 화면이 깜빡이지 않게 저장된 테마를 먼저 적용 (lib/preferences.ts와 같은 규칙)
      try {
        var t = (JSON.parse(localStorage.getItem('arche.preferences') || '{}').theme) || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
