spring:
  application:
    name: arche
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arche}
    username: ${DB_USERNAME:arche}
    password: ${DB_PASSWORD:arche}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
