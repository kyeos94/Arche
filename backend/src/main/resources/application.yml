spring:
  application:
    name: arche
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arche}
    username: ${DB_USERNAME:arche}
    password: ${DB_PASSWORD:arche}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

# 아래 기본값은 로컬 개발·데모 전용이다. 운영에서는 환경변수로 반드시 교체한다 (guide 10.2: KMS·Vault의 데이터 키).
arche:
  crypto:
    field-key-v1: ${ARCHE_FIELD_KEY_V1:sJ+1VdSKc1UcYhAj245xtoYGGgXAWs9bhnIHR+Jd4cA=}
    index-key: ${ARCHE_INDEX_KEY:HJ+l1Svx2/wH1LSw9LmSv5ni60qxXLvvoXhkWpgolfY=}
  integration:
    virtual-account:
      secret: ${ARCHE_VA_SECRET:local-virtual-account-secret}
    # 대출 비교 플랫폼 Mock (가상 플랫폼 코드). 수신 API는 X-Platform-Key 헤더로 인증
    platform:
      mock:
        code: MOCKPLAT
        api-key: ${ARCHE_PLATFORM_KEY:local-platform-key}
  # 신청 서류 파일 저장 위치 (로컬 디스크 어댑터). 운영은 NAS 마운트 경로 등으로 교체
  storage:
    dir: ${ARCHE_STORAGE_DIR:${java.io.tmpdir}/arche-storage}
  # 고객에게 문자로 보내는 본인인증 랜딩 링크의 사이트 주소 (guide 11.3)
  landing:
    base-url: ${ARCHE_LANDING_BASE_URL:http://localhost:5173}
  origination:
    # 중개수수료 조기 완제 환수 점검 (R56, 일마감 23:00 뒤)
    clawback-cron: "0 30 23 * * *"
    # 심사자 배정 전략: least-loaded(정책서 7장 기본) 또는 round-robin
    assignment-strategy: ${ARCHE_ASSIGNMENT_STRATEGY:least-loaded}
  demo:
    # 데모 직원(역할별 1명)과 G11·G27·G28 재현용 계약을 만든다. 운영에서는 false
    enabled: ${ARCHE_DEMO:true}
    password: ${ARCHE_DEMO_PASSWORD:arche1234!}
  bootstrap:
    admin-password: ${ARCHE_ADMIN_PASSWORD:}
  scheduling:
    enabled: true
  closing:
    cron: "0 0 23 * * *"
    # 기동 시 업무일자가 오늘보다 늦으면 밀린 일마감을 하루씩 처리해 오늘로 맞춘다.
    # 데모를 2026-06-12(golden 사례 G11·G27·G28 재현 시점)에 고정하려면 false
    catch-up: ${ARCHE_CATCH_UP:true}
